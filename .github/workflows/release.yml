name: Release

# Push a version tag to cut a release:
#   git tag v1.0.1 && git push origin v1.0.1
#
# Publishes the assets electron-updater needs to auto-update the app:
#   Installation-System-Setup-<version>.exe            first-time Windows installer
#   Installation-System-Setup-<version>.exe.blockmap   used for differential downloads
#   latest.yml                                          feed electron-updater polls for new versions
#   SHA256SUMS.txt                                      checksums so a download can be verified
#
# The dashes matter: electron-updater's latest.yml always references the
# artifact with spaces replaced by dashes, so the nsis.artifactName override
# in package.json must produce that exact name or auto-update breaks.
#
# This repository is private, so CI is trusted to seed the database connection
# from repository secrets (Settings > Secrets and variables > Actions):
#   PG_PROXY_URL, PG_PROXY_DATABASE, PG_PROXY_TOKEN               required
#   PG_SOURCE_PROXY_URL, PG_SOURCE_PROXY_DATABASE, PG_SOURCE_PROXY_TOKEN   optional
#   UPDATE_GITHUB_TOKEN                                             required for auto-update
# Release assets inherit repository visibility, so this build only runs the
# seeding step when the repo is confirmed PRIVATE - see the guard below. If the
# repo ever goes public, remove the PG_* secrets first; the guard refuses to
# publish credentials on a public release rather than warning about it.
#
# Runs automatically on every version tag push. workflow_dispatch is kept as a
# manual fallback (e.g. to rebuild a tag without pushing a new one).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  # scripts/release.ps1 (RELEASE.cmd) is a fallback that builds locally and
  # pushes the tag itself - which would also trigger this workflow for the
  # same tag. Whichever publish happens first wins; this job lets the other
  # one notice a release already exists and stand down instead of racing it
  # or clobbering the assets that already went out.
  check:
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Resolve version and check for an existing release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          $tag = "v$v"
          "tag=$tag" >> $env:GITHUB_OUTPUT

          gh release view $tag --repo "${{ github.repository }}" 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag is already published (likely built locally via RELEASE.cmd) - skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Building $tag"
            "skip=false" >> $env:GITHUB_OUTPUT
          }

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ needs.check.outputs.tag }}"
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $tag"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Sync package.json version with the release tag
        shell: pwsh
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.ver.outputs.version }}

      - name: Write .env.local from repository secrets
        shell: pwsh
        env:
          HAS_KEYS: ${{ secrets.PG_PROXY_TOKEN != '' }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          PG_PROXY_URL: ${{ secrets.PG_PROXY_URL }}
          PG_PROXY_DATABASE: ${{ secrets.PG_PROXY_DATABASE }}
          PG_PROXY_TOKEN: ${{ secrets.PG_PROXY_TOKEN }}
          PG_SOURCE_PROXY_URL: ${{ secrets.PG_SOURCE_PROXY_URL }}
          PG_SOURCE_PROXY_DATABASE: ${{ secrets.PG_SOURCE_PROXY_DATABASE }}
          PG_SOURCE_PROXY_TOKEN: ${{ secrets.PG_SOURCE_PROXY_TOKEN }}
          UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN }}
        run: |
          # No secrets is the normal path. The app asks for the connection
          # details on first run and stores them in userData, so a key-free
          # installer is a complete one - not a degraded build.
          if ($env:HAS_KEYS -ne 'true') {
            Write-Host "No PG_* secrets configured - building a key-free installer."
            exit 0
          }

          # Release assets inherit repository visibility, so a seeded installer
          # attached to a public release hands live database credentials to
          # anyone who finds the URL - and the operational token is full-access,
          # reaching customer and payment records without going near the login
          # screen. A warning is not enough for something irreversible: once the
          # asset is published it may already have been fetched. Refuse instead.
          if ($env:IS_PRIVATE -ne 'true') {
            throw @"
          PG_* secrets are configured but this repository is PUBLIC.

          A seeded installer on a public release exposes live database
          credentials to anyone who finds the URL. Either make the repository
          private before tagging, or remove the PG_* secrets to build a
          key-free installer.

          To give staff a zero-setup install while the repository stays public,
          build locally (npm run dist:win, which picks up .env.local) and hand
          that installer over privately. Credentials land in userData on first
          boot, so those machines keep working across key-free public updates.
          "@
          }

          # Report every secret by name. A bare "it's missing" cannot distinguish
          # a typo'd name from an Environment-scoped secret (which this job would
          # not see) from one that was never added.
          $missing = @()
          foreach ($name in @("PG_PROXY_URL", "PG_PROXY_DATABASE", "PG_PROXY_TOKEN")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Host "  MISSING  $name"
              $missing += $name
            } else {
              # Length only - never the value itself, which would land in the log.
              Write-Host "  present  $name ($($value.Length) chars)"
            }
          }

          if ($missing.Count -gt 0) {
            throw @"
          Partially configured: $($missing -join ', ') missing.

          Add them under Settings > Secrets and variables > Actions, on the
          "Secrets" tab (not "Variables"), as *Repository* secrets - names are
          case-sensitive and must match exactly. Environment secrets will not
          work here: this job declares no environment, so it cannot read them.
          Or remove all three to build a key-free installer.
          "@
          }

          # The source connection (read-only business database the pipeline is
          # built from) ships alongside the operational one. If its secrets are
          # absent the app falls back to the operational connection, matching
          # the single-database arrangement older installs use.
          $lines = @(
            "PG_PROXY_URL=$env:PG_PROXY_URL",
            "PG_PROXY_DATABASE=$env:PG_PROXY_DATABASE",
            "PG_PROXY_TOKEN=$env:PG_PROXY_TOKEN"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:PG_SOURCE_PROXY_TOKEN)) {
            Write-Host "  present  PG_SOURCE_PROXY_* (source database seeded too)"
            $lines += @(
              "PG_SOURCE_PROXY_URL=$env:PG_SOURCE_PROXY_URL",
              "PG_SOURCE_PROXY_DATABASE=$env:PG_SOURCE_PROXY_DATABASE",
              "PG_SOURCE_PROXY_TOKEN=$env:PG_SOURCE_PROXY_TOKEN"
            )
          } else {
            Write-Host "  absent   PG_SOURCE_PROXY_* (source falls back to the operational connection)"
          }

          # Private release assets are not readable without credentials, so a
          # build without this token checks for updates, gets 404, and reports
          # "no update available" forever. Nothing appears broken, which is why
          # this warns loudly rather than leaving it to be discovered when a fix
          # fails to reach anyone.
          if (-not [string]::IsNullOrWhiteSpace($env:UPDATE_GITHUB_TOKEN)) {
            Write-Host "  present  UPDATE_GITHUB_TOKEN (auto-update will work)"
            $lines += "UPDATE_GITHUB_TOKEN=$env:UPDATE_GITHUB_TOKEN"
          } else {
            Write-Host "::warning::UPDATE_GITHUB_TOKEN is not set. This build cannot read private release assets, so staff will never be offered an update. Add it as a repository secret and re-release."
          }

          $lines -join "`n" | Set-Content -Path .env.local -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build installer
        shell: pwsh
        run: npm run dist:win

      - name: Verify expected assets were produced
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $outDir = "C:/tmp/installation-system-release"
          foreach ($f in @("Installation-System-Setup-$v.exe",
                            "Installation-System-Setup-$v.exe.blockmap",
                            "latest.yml")) {
            $full = Join-Path $outDir $f
            if (!(Test-Path $full)) { throw "Missing expected artifact: $full" }
          }
          Get-ChildItem $outDir -File | Format-Table Name, Length

      # sha256sum -c format: lowercase hash, two spaces, bare filename. Lets
      # anyone confirm the .exe they downloaded is the one this run built.
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $outDir = "C:/tmp/installation-system-release"
          $lines = foreach ($f in @("Installation-System-Setup-$v.exe",
                                    "Installation-System-Setup-$v.exe.blockmap",
                                    "latest.yml")) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $outDir $f)).Hash.ToLower()
            "$hash  $f"
          }
          $lines | Set-Content -Path (Join-Path $outDir "SHA256SUMS.txt") -Encoding ascii
          Get-Content (Join-Path $outDir "SHA256SUMS.txt")

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Installation System ${{ steps.ver.outputs.tag }}

            **Download for your platform:**
            - **Windows**: Installation-System-Setup-${{ steps.ver.outputs.version }}.exe

            Existing users: Auto-update is enabled in the dashboard.

            Windows will show a "Windows protected your PC" warning on first run —
            click **More info**, then **Run anyway**. See the
            [user guide](https://github.com/NurulAqilahSaifulBahril/Installation-System/blob/main/USER-GUIDE.md).

            This installer asks for the database connection on first run. Staff
            machines are set up from the internally distributed copy instead and
            need no details entered.
          files: |
            C:/tmp/installation-system-release/Installation-System-Setup-${{ steps.ver.outputs.version }}.exe
            C:/tmp/installation-system-release/Installation-System-Setup-${{ steps.ver.outputs.version }}.exe.blockmap
            C:/tmp/installation-system-release/latest.yml
            C:/tmp/installation-system-release/SHA256SUMS.txt
            Installation Desktop app_user_guide.pdf
